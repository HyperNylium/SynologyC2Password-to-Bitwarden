name: Build .exe on Release
run-name: "Build PyInstaller exe for ${{ github.event.release.name }}"

on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build-and-attach-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"

      - name: Build exe (onefile)
        run: uv run pyinstaller --onefile syno2bw.py

      - name: Create release-sha256.txt
        shell: pwsh
        run: |
          $exe = "dist/syno2bw.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  syno2bw.exe" | Out-File -Encoding utf8 "dist/release-sha256.txt"
          Get-Content "dist/release-sha256.txt"

      - name: Upload exe and checksum to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/syno2bw.exe
            dist/release-sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
