[project]
name = "SynologyC2Password-to-Bitwarden"
description = "A tool to convert Synology C2 Password export files to Bitwarden import format."
version = "1.5.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "ruff>=0.16.0",
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
]
test = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

preview = true

[tool.ruff.lint]
select = ["E", "W", "F", "B", "UP", "RUF"]
ignore = ["line-too-long", "redundant-open-modes", "true-false-comparison"]
extend-select = ["relative-imports"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--verbose --color=yes"

